{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Mayi - Connexion Dashboard</title>
  <link rel="stylesheet" href="{% static 'dashboard/css/theme.min.css' %}">
  <style>
    body { background-color: #f5f7f9; }
    .card { border: none; box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15); border-radius: 1rem; }
    .btn-primary { background-color: #1A237E; border-color: #1A237E; }
  </style>
</head>
<body class="d-flex align-items-center vh-100">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="text-center mb-5">
           <h2 class="fw-bold" style="color: #1A237E;">MAYI</h2>
           <p class="text-muted">Accès réservé aux administrateurs</p>
        </div>
        <div class="card p-4">
          <form method="post">
            {% csrf_token %}
            {% if form.errors %}
              <div class="alert alert-danger py-2 fs-6">
                Identifiants incorrects ou accès non autorisé.
              </div>
            {% endif %}
            
            <div class="mb-3">
              <label for="username" class="form-label text-muted small fw-bold uppercase">Pseudo</label>
              <input type="text" name="username" class="form-control" id="username" placeholder="votre_pseudo" required autofocus>
            </div>
            <div class="mb-4">
              <label for="password" class="form-label text-muted small fw-bold">Mot de passe</label>
              <input type="password" name="password" class="form-control" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold rounded-3">Se connecter</button>
          </form>
        </div>
        <p class="text-center mt-4 small text-muted">
          &copy; 2026 MAYI TOGO TOURISM
        </p>
      </div>
    </div>
  </div>
</body>
</html>
